name: Agent - Research Specialist 🕵️

on:
  push:
    paths:
      - 'tasks/01_research_modules.md'
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Create research issue
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: '🤖 Research: HR Modules'
          content-filepath: 'tasks/01_research_modules.md'
          labels: 'agent,research'
