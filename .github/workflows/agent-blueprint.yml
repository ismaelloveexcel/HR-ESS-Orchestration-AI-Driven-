name: Agent - Blueprint Architect 🏗️

on:
  push:
    paths:
      - 'tasks/02_integration_blueprint.md'
  workflow_dispatch:
    inputs:
      task_description:
        description: 'Architecture/design task to perform'
        required: true
        default: 'Design system architecture for HR ESS module integration'
        type: string
      issue_number:
        description: 'Related issue number (for status updates)'
        required: false
        default: ''
        type: string
      diagram_style:
        description: 'Diagram notation style'
        required: false
        default: 'mermaid'
        type: choice
        options:
          - mermaid
          - ascii
          - both

env:
  BLUEPRINT_DIR: blueprints
  DATA_DIR: data/output

jobs:
  blueprint:
    name: 🏗️ Execute Architecture Task
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y jq curl
          mkdir -p ${{ env.BLUEPRINT_DIR }} ${{ env.DATA_DIR }}
          echo "✅ Environment ready"

      - name: Determine task context
        id: context
        run: |
          # Determine if triggered manually or by file change
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TASK="${{ github.event.inputs.task_description }}"
            ISSUE_NUM="${{ github.event.inputs.issue_number }}"
            DIAGRAM_STYLE="${{ github.event.inputs.diagram_style }}"
          else
            # Read from task file for push triggers
            TASK=$(cat tasks/02_integration_blueprint.md | head -100)
            ISSUE_NUM=""
            DIAGRAM_STYLE="both"
          fi
          
          # Generate unique filename based on timestamp
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          BLUEPRINT_FILE="blueprint-${TIMESTAMP}.md"
          DATA_FILE="blueprint-${TIMESTAMP}.json"
          
          echo "task<<EOF" >> $GITHUB_OUTPUT
          echo "$TASK" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "issue_num=$ISSUE_NUM" >> $GITHUB_OUTPUT
          echo "diagram_style=$DIAGRAM_STYLE" >> $GITHUB_OUTPUT
          echo "blueprint_file=$BLUEPRINT_FILE" >> $GITHUB_OUTPUT
          echo "data_file=$DATA_FILE" >> $GITHUB_OUTPUT
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
          
          echo "📋 Task: $TASK"
          echo "📁 Blueprint: $BLUEPRINT_FILE"

      - name: Execute AI Architecture Design
        id: blueprint
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "🏗️ Starting AI-powered architecture design..."
          
          TASK="${{ steps.context.outputs.task }}"
          DIAGRAM_STYLE="${{ steps.context.outputs.diagram_style }}"
          
          # Build the architecture prompt
          PROMPT=$(cat <<'EOFPROMPT'
You are a senior solutions architect specializing in HR systems and enterprise integrations.

**ARCHITECTURE TASK:**
${TASK_PLACEHOLDER}

**CONTEXT:**
- Target: UAE multi-entity HR ESS system
- Stack: Node.js/TypeScript backend, REST APIs
- Requirements: UAE labor law compliance, multi-entity support
- Focus: Modular, scalable, maintainable design

**INSTRUCTIONS:**
1. Create a comprehensive architecture blueprint
2. Include system diagrams using Mermaid notation
3. Define component responsibilities
4. Specify integration patterns
5. Document data flows
6. Include security considerations
7. Provide deployment recommendations

**OUTPUT FORMAT:**
Structure your response as an architecture document with:

## Overview
Brief description of the architecture

## System Architecture Diagram
```mermaid
[Include a flowchart or component diagram]
```

## Component Breakdown
Detailed description of each component

## Data Flow
How data moves through the system

## Integration Points
External systems and APIs

## Security Architecture
Authentication, authorization, data protection

## Scalability Considerations
How the system handles growth

## Implementation Phases
Recommended build order

## Technical Decisions
Key choices and rationale

Be specific, practical, and aligned with UAE HR requirements.
EOFPROMPT
          )
          
          # Replace placeholder with actual task
          PROMPT=$(echo "$PROMPT" | sed "s|\${TASK_PLACEHOLDER}|$TASK|g")
          
          # Call OpenAI API
          RESPONSE=$(curl -s --max-time 90 https://api.openai.com/v1/chat/completions \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d @- <<EOFCURL
{
  "model": "gpt-4-turbo-preview",
  "messages": [
    {
      "role": "system",
      "content": "You are a solutions architect. Create detailed, practical architecture blueprints with Mermaid diagrams. Always include working Mermaid code blocks."
    },
    {
      "role": "user",
      "content": $(echo "$PROMPT" | jq -Rs .)
    }
  ],
  "temperature": 0.2,
  "max_tokens": 4000
}
EOFCURL
          2>&1)
          
          # Extract the blueprint content
          BLUEPRINT_CONTENT=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // "Blueprint generation failed"')
          
          if [ "$BLUEPRINT_CONTENT" = "null" ] || [ -z "$BLUEPRINT_CONTENT" ]; then
            echo "⚠️ AI API returned no content, using fallback"
            BLUEPRINT_CONTENT="## Architecture Blueprint\n\n**Task:** $TASK\n\n**Status:** AI design could not be completed. Please check API configuration.\n\n**Recommendation:** Review OPENAI_API_KEY secret and retry."
          fi
          
          # Save blueprint content for next step
          echo "$BLUEPRINT_CONTENT" > /tmp/blueprint_content.md
          echo "✅ Architecture design completed"

      - name: Generate Blueprint Document
        run: |
          BLUEPRINT_FILE="${{ env.BLUEPRINT_DIR }}/${{ steps.context.outputs.blueprint_file }}"
          TASK="${{ steps.context.outputs.task }}"
          TIMESTAMP="${{ steps.context.outputs.timestamp }}"
          
          # Create the blueprint document with metadata
          cat > "$BLUEPRINT_FILE" <<EOFBLUEPRINT
# 🏗️ Architecture Blueprint

**Generated:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")  
**Agent:** Blueprint Architect  
**Run ID:** ${{ github.run_id }}  
**Triggered By:** ${{ github.event_name }}

---

## 📋 Design Task

> $TASK

---

$(cat /tmp/blueprint_content.md)

---

## 📊 Document Metadata

| Field | Value |
|-------|-------|
| Timestamp | $TIMESTAMP |
| Workflow | ${{ github.workflow }} |
| Repository | ${{ github.repository }} |
| Branch | ${{ github.ref_name }} |
| Actor | ${{ github.actor }} |

---

*This blueprint was auto-generated by the Blueprint Architect Agent 🏗️*
EOFBLUEPRINT

          echo "📐 Blueprint saved to $BLUEPRINT_FILE"

      - name: Generate JSON Data
        run: |
          DATA_FILE="${{ env.DATA_DIR }}/${{ steps.context.outputs.data_file }}"
          TASK="${{ steps.context.outputs.task }}"
          TIMESTAMP="${{ steps.context.outputs.timestamp }}"
          BLUEPRINT_CONTENT=$(cat /tmp/blueprint_content.md)
          
          # Create structured JSON output
          jq -n \
            --arg task "$TASK" \
            --arg timestamp "$TIMESTAMP" \
            --arg content "$BLUEPRINT_CONTENT" \
            --arg run_id "${{ github.run_id }}" \
            --arg actor "${{ github.actor }}" \
            --arg event "${{ github.event_name }}" \
            --arg issue "${{ steps.context.outputs.issue_num }}" \
            '{
              "type": "architecture_blueprint",
              "agent": "blueprint_architect",
              "task": $task,
              "timestamp": $timestamp,
              "content": $content,
              "metadata": {
                "run_id": $run_id,
                "actor": $actor,
                "trigger": $event,
                "related_issue": (if $issue == "" then null else $issue end)
              },
              "status": "completed"
            }' > "$DATA_FILE"
          
          echo "📊 JSON data saved to $DATA_FILE"

      - name: Commit and push results
        run: |
          git config user.name "Blueprint Agent 🏗️"
          git config user.email "blueprint-agent@github-actions.local"
          
          # Add all generated files
          git add ${{ env.BLUEPRINT_DIR }}/ ${{ env.DATA_DIR }}/ || true
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "ℹ️ No changes to commit"
          else
            COMMIT_MSG="🏗️ Architecture Blueprint: ${{ steps.context.outputs.timestamp }}

Task: ${{ steps.context.outputs.task }}
Triggered by: ${{ github.event_name }}
Run ID: ${{ github.run_id }}"
            
            git commit -m "$COMMIT_MSG"
            
            # Push with retry logic
            RETRY_COUNT=0
            MAX_RETRIES=4
            DELAY=4
            
            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              if git push; then
                echo "✅ Results pushed successfully"
                break
              else
                RETRY_COUNT=$((RETRY_COUNT + 1))
                echo "⚠️ Push failed, retry $RETRY_COUNT/$MAX_RETRIES in ${DELAY}s..."
                sleep $DELAY
                DELAY=$((DELAY * 2))
              fi
            done
            
            if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
              echo "❌ Failed to push after $MAX_RETRIES attempts"
              exit 1
            fi
          fi

      - name: Update related issue
        if: steps.context.outputs.issue_num != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NUM="${{ steps.context.outputs.issue_num }}"
          BLUEPRINT_FILE="${{ steps.context.outputs.blueprint_file }}"
          REPO="${{ github.repository }}"
          
          # Create a summary comment
          COMMENT=$(cat <<EOFCOMMENT
## 🏗️ Architecture Blueprint Complete!

The Blueprint Architect Agent has completed the design.

### 📐 Blueprint Location
- **Architecture Document:** \`blueprints/$BLUEPRINT_FILE\`
- **JSON Data:** \`data/output/${{ steps.context.outputs.data_file }}\`

### 📋 Design Task Completed
> ${{ steps.context.outputs.task }}

### 🔗 Links
- [View Workflow Run](https://github.com/$REPO/actions/runs/${{ github.run_id }})
- [View Blueprint](https://github.com/$REPO/blob/${{ github.ref_name }}/blueprints/$BLUEPRINT_FILE)

---
*Auto-generated by Blueprint Architect 🏗️*
EOFCOMMENT
          )
          
          # Post comment to issue
          curl -s -X POST "https://api.github.com/repos/$REPO/issues/$ISSUE_NUM/comments" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            -d "$(jq -n --arg body "$COMMENT" '{body: $body}')"
          
          echo "💬 Posted update to issue #$ISSUE_NUM"

      - name: Summary
        run: |
          echo "## 🏗️ Blueprint Agent Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Task | ${{ steps.context.outputs.task }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Blueprint | \`blueprints/${{ steps.context.outputs.blueprint_file }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Data | \`data/output/${{ steps.context.outputs.data_file }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ✅ Completed |" >> $GITHUB_STEP_SUMMARY
