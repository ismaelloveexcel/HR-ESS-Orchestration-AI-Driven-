name: Agent - Blueprint Architect 🏗️

on:
  push:
    paths:
      - 'tasks/02_integration_blueprint.md'
  workflow_dispatch:

jobs:
  blueprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Create blueprint issue
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: '📐 Blueprint: System Design'
          content-filepath: 'tasks/02_integration_blueprint.md'
          labels: 'agent,blueprint'
